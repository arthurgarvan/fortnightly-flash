<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortnightly Flash - Agricultural Market Report</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #8B7355 0%, #6B5344 50%, #4A7C59 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .report-container {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
        }
        
        .last-updated {
            text-align: center;
            color: white;
            margin-bottom: 20px;
            font-size: 0.95rem;
            opacity: 0.8;
        }
        
        .report-content {
            line-height: 1.8;
            color: #333;
        }
        
        .report-content h2 {
            color: #8B7355;
            margin-top: 20px;
            margin-bottom: 12px;
            font-size: 1.3rem;
            border-bottom: 2px solid #D4AF37;
            padding-bottom: 8px;
        }
        
        .report-content h3 {
            color: #6B5344;
            margin-top: 15px;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }
        
        .report-content p {
            margin-bottom: 12px;
        }
        
        .report-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
        }
        
        .report-content th,
        .report-content td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
            font-size: 0.9rem;
        }
        
        .report-content th {
            background-color: #8B7355;
            color: white;
            font-weight: 600;
        }
        
        .report-content tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        
        .report-content a {
            color: #0066cc;
            text-decoration: none;
            word-break: break-word;
        }
        
        .report-content a:hover {
            text-decoration: underline;
        }
        
        .loading {
            text-align: center;
            color: white;
            padding: 40px 20px;
            font-size: 1.2rem;
        }
        
        .error {
            background: #fee;
            border: 2px solid #fcc;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }
        
        .sources {
            background: #f0f0f0;
            border-left: 4px solid #8B7355;
            padding: 15px;
            margin-top: 20px;
            border-radius: 4px;
            font-size: 0.85rem;
        }
        
        .sources h4 {
            color: #8B7355;
            margin-bottom: 10px;
        }
        
        .sources a {
            display: block;
            margin: 5px 0;
            color: #0066cc;
            text-decoration: none;
            word-break: break-all;
        }
        
        .sources a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚡ Fortnightly Flash</h1>
            <p class="subtitle">Agricultural Market Intelligence Report</p>
        </header>
        
        <div class="last-updated" id="lastUpdated"></div>
        
        <div id="reportContainer" class="report-container">
            <div class="loading">Loading market report...</div>
        </div>
        
        <div id="error" class="error" style="display: none;"></div>
    </div>
    
    <script>
        async function fetchReport() {
            try {
                const res = await fetch('data.json'); 
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return await res.json();
            } catch(e) {
                console.error('Fetch error:', e);
                return null;
            }
        }
        
        function renderReport(data) {
            const container = document.getElementById('reportContainer');
            container.innerHTML = '';
            
            if (!data.report) {
                container.innerHTML = '<div class="loading">No report data available</div>';
                return;
            }
            
            const reportDiv = document.createElement('div');
            reportDiv.className = 'report-content';
            reportDiv.innerHTML = data.report;
            
            container.appendChild(reportDiv);
            
            // Add sources section
            if (data.datasources) {
                const sourcesDiv = document.createElement('div');
                sourcesDiv.className = 'sources';
                sourcesDiv.innerHTML = '<h4>📋 Data Sources:</h4>';
                
                Object.entries(data.datasources).forEach(([key, url]) => {
                    const link = document.createElement('a');
                    link.href = url;
                    link.target = '_blank';
                    link.textContent = `${key.charAt(0).toUpperCase() + key.slice(1)}: ${url}`;
                    sourcesDiv.appendChild(link);
                });
                
                reportDiv.appendChild(sourcesDiv);
            }
        }
        
        function updateTimestamp(timestamp) {
            const lastUpdated = document.getElementById('lastUpdated');
            const date = new Date(timestamp);
            lastUpdated.textContent = `📅 Last updated: ${date.toLocaleString('en-AU')}`;
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = `⚠️ ${message}`;
            errorDiv.style.display = 'block';
        }
        
        async function loadReport() {
            const data = await fetchReport();
            
            if (!data) {
                showError('Failed to load market report. Please try again later.');
                return;
            }
            
            renderReport(data);
            updateTimestamp(data.timestamp);
        }
        
        // Load report when page loads
        loadReport();
        
        // Refresh report every 5 minutes
        setInterval(loadReport, 5 * 60 * 1000);
    </script>
</body>
</html>
